# ==============================================================================
# Prozo Fulfilment Centre (FC) Margin Monitoring System
# Global Docker Compose Specification (Production & EC2 Deployment)
# Uses PostgreSQL for DB and native AWS S3 for object storage
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: prozo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prozo_margin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-prozo_margin}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prozo-network

  # ----------------------------------------------------------------------------
  # 2. REST API Service (Express.js)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prozo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prozo_margin}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-prozo_margin}}
      WEB_URL: ${WEB_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost/api/v1}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-32-chars-minimum-needed-for-security}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-32-chars-minimum-needed-for-security}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-test}
      EMAIL_FROM: ${EMAIL_FROM:-Prozo Margin Monitor <alerts@example.com>}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - prozo-network

  # ----------------------------------------------------------------------------
  # 3. Background Asynchronous Worker Service (PostgreSQL Job Queue)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: prozo-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prozo_margin}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-prozo_margin}}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      WORKER_ID: ${WORKER_ID:-worker-docker-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-120}
      JOB_HEARTBEAT_INTERVAL_SECONDS: ${JOB_HEARTBEAT_INTERVAL_SECONDS:-30}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-test}
      EMAIL_FROM: ${EMAIL_FROM:-Prozo Margin Monitor <alerts@example.com>}
    networks:
      - prozo-network

  # ----------------------------------------------------------------------------
  # 4. Web Dashboard Frontend (Next.js 15)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: prozo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - prozo-network

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy (Gateway)
  # ----------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: prozo-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/var/www/certbot:ro
      - ssl_certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - prozo-network

# ==============================================================================
# Persistent Volumes & Network
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  certbot_data:
    driver: local
  ssl_certs:
    driver: local

networks:
  prozo-network:
    driver: bridge
